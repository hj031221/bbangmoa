  <text x="66" y="464" font-size="26" font-weight="700" fill="#4C310D">대전 5개 구 · 나만의 목표 · 인증 방문</text>
  <text x="66" y="521" font-size="22" fill="#A98561">빵모아에서 시작하는 대전 빵 스탬프 투어</text>

