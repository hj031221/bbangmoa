<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>대전 빵집 지도 · 데모 (실데이터)</title>
<style>
  :root{--bg:#FAF3E8;--card:#fff;--ink:#2B2018;--muted:#8A7A66;--line:#EADCC6;--brown:#6B4A2B;--accent:#E8862B;--accent2:#C9621A;--green:#3FA877}
  *{box-sizing:border-box}
  body{margin:0;font-family:"Pretendard","Malgun Gothic",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
  .top{display:flex;align-items:center;gap:10px;padding:11px 18px;background:#fff;border-bottom:1px solid var(--line)}
  .top b{font-size:16px;color:var(--brown)}
  .top .tag{font-size:11px;color:var(--muted);background:#F1E7D6;padding:2px 8px;border-radius:999px}
  .top .sp{flex:1}
  .chip{font-size:12px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 11px;cursor:pointer}
  .chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .screen{display:none}.screen.on{display:block}
  /* landing / survey */
  .center{max-width:540px;margin:8vh auto;text-align:center;padding:0 20px}
  .hero{height:120px;border-radius:18px;background:linear-gradient(135deg,#F4C77E,#E8862B);display:flex;align-items:center;justify-content:center;font-size:52px;margin-bottom:16px}
  h1{font-size:25px;letter-spacing:-.5px;margin:6px 0}
  .sub{color:var(--muted);font-size:14px}
  .btn{background:var(--accent);color:#fff;border:none;border-radius:12px;padding:13px 24px;font-size:15px;font-weight:700;cursor:pointer}
  .btn.ghost{background:#fff;color:var(--brown);border:1.5px solid var(--line)}
  .prog{height:6px;background:#EFE3D0;border-radius:6px;max-width:540px;margin:18px auto 0}
  .prog>div{height:100%;background:var(--accent);border-radius:6px;transition:.3s}
  .vs{display:flex;gap:14px;justify-content:center;margin:24px 0}
  .vscard{flex:1;max-width:210px;border:2px solid var(--line);border-radius:18px;padding:28px 12px;cursor:pointer;background:#fff;transition:.15s}
  .vscard:hover{border-color:var(--accent);transform:translateY(-4px)}
  .vscard .emo{font-size:42px}.vscard b{display:block;margin-top:8px;font-size:16px}
  .vsx{align-self:center;font-weight:800;color:var(--accent)}
  /* result */
  .result{display:flex;height:calc(100vh - 49px);min-height:560px}
  #map{flex:1.7;min-width:0;min-height:560px;background:#e9efe6}
  .list{flex:1;max-width:330px;overflow:auto;border-left:1px solid var(--line);background:#FBF6EF}
  .detail{flex:1.05;max-width:330px;overflow:auto;border-left:1px solid var(--line);background:#fff;padding:16px}
  .lhead{padding:11px 14px;font-size:12px;color:var(--muted);position:sticky;top:0;background:#FBF6EF;border-bottom:1px solid var(--line)}
  .lc{padding:11px 14px;border-bottom:1px solid var(--line);cursor:pointer}
  .lc:hover{background:#fff}.lc.sel{background:#fff;box-shadow:inset 3px 0 0 var(--accent)}
  .lc b{font-size:14px}.lc .rk{display:inline-block;min-width:18px;height:18px;background:var(--accent);color:#fff;border-radius:50%;text-align:center;line-height:18px;font-size:11px;margin-right:6px}
  .lc .ad{font-size:11.5px;color:var(--muted);margin-top:3px}
  .badge{display:inline-block;background:#FCEBD7;color:var(--accent2);font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:999px;margin-left:4px}
  .open{display:inline-block;background:#E6F2EA;color:var(--green);font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:999px;margin-left:4px}
  .detail h2{font-size:18px;margin:0 0 2px}
  .dimg{height:120px;border-radius:12px;background:linear-gradient(135deg,#F4C77E,#E8862B);margin:10px 0}
  .dt{display:flex;gap:8px;font-size:13px;margin:7px 0}.dt .ic{width:18px}
  .src{font-size:11px;color:var(--muted);margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}
  .ph{color:#bbb;font-size:13px;text-align:center;margin-top:40px}
  a.kakao{color:var(--accent2);font-size:13px;text-decoration:none}
</style>
</head>
<body>
<div class="top">
  <b>🥐 대전 빵집 지도</b><span class="tag">데모 · 실데이터(카카오 장소검색)</span>
  <span class="sp"></span>
  <span class="chip" id="cOpen" onclick="toggleOpen()">🕒 지금 열린 곳</span>
  <span class="chip" id="cFamous" onclick="toggleFamous()">⭐ 명물만</span>
  <span class="chip" onclick="go('s1')">↺ 처음</span>
</div>

<!-- 1 랜딩 -->
<div class="screen on" id="s1"><div class="center">
  <div class="hero">🥐</div>
  <h1>대전의 모든 빵, 모아 보세요</h1>
  <p class="sub">질문 두 개만 고르면 지도 위에 취향 맞춤 빵집이 떠요.</p>
  <div style="margin-top:18px"><button class="btn" onclick="go('s2')">시작하기</button></div>
</div></div>

<!-- 2 설문 -->
<div class="screen" id="s2">
  <div class="prog"><div id="pbar" style="width:50%"></div></div>
  <div class="center" id="qbox"></div>
</div>

<!-- 3 결과 -->
<div class="screen" id="s3"><div class="result">
  <div id="map"></div>
  <div class="list" id="list"><div class="lhead" id="lhead">불러오는 중…</div></div>
  <div class="detail" id="detail"><div class="ph">왼쪽에서 빵집을 선택하세요</div></div>
</div></div>

<script>
// ---- 관광공사 명물(제과 3곳) 정적 보강: 실제 detailIntro2 값 ----
const TOUR = {
  '성심당': {hours:'08:00~22:00 · 연중무휴', parking:'주차 불가 (인근 공영)', menu:'튀김소보로, 판타롱부추빵', badge:'대전 명물'},
  '그린베이커리': {badge:'관광공사 등재'},
  '꾸드뱅': {badge:'관광공사 등재'}
};
function tourOf(name){ for(const k in TOUR){ if(name.includes(k)) return {key:k, ...TOUR[k]}; } return null; }

// ---- 설문 (VS 2문항) ----
const Q=[
  {id:'taste', q:'오늘은 어떤 빵이 먹고 싶나요?', a:[{e:'🍰',t:'달달한 빵',v:'sweet'},{e:'🥖',t:'짭짤한 빵',v:'salty'}]},
  {id:'explore', q:'어떤 빵집을 찾고 있나요?', a:[{e:'⭐',t:'대전 명물',v:'famous'},{e:'🔍',t:'숨은 동네 빵집',v:'local'}]}
];
let step=0; const ans={};
function renderQ(){
  const cur=Q[step]; document.getElementById('pbar').style.width=((step+1)/Q.length*100)+'%';
  document.getElementById('qbox').innerHTML =
    '<div style="font-size:12px;color:var(--muted);letter-spacing:.5px">취향 설문 '+(step+1)+'/'+Q.length+'</div>'+
    '<h1>'+cur.q+'</h1><div class="vs">'+
    cur.a.map((o,i)=> (i===1?'<div class="vsx">VS</div>':'') + '<div class="vscard" onclick="pick(\''+cur.id+'\',\''+o.v+'\')"><div class="emo">'+o.e+'</div><b>'+o.t+'</b></div>').join('')+
    '</div><button class="btn ghost" onclick="finish()">건너뛰고 결과</button>';
}
function pick(id,v){ ans[id]=v; if(step<Q.length-1){step++;renderQ();} else finish(); }
function go(id){ document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id));
  if(id==='s2'){step=0;renderQ();} if(id==='s3'){setTimeout(initResult,80);} }
function finish(){ go('s3'); }

// ---- 지도 + 실데이터 ----
let map, clusterer, places=[], markers=[], selected=null, onlyOpen=false, onlyFamous=false;
function nowOpen(t){ if(!t||!t.hours) return null; const m=t.hours.match(/(\d{1,2}):(\d{2})~(\d{1,2}):(\d{2})/); if(!m) return null;
  const now=new Date(), cur=now.getHours()*60+now.getMinutes(); const s=+m[1]*60+ +m[2], e=+m[3]*60+ +m[4]; return cur>=s&&cur<=e; }

function initResult(){
  const el=document.getElementById('map');
  if(!(window.kakao&&kakao.maps&&kakao.maps.services)){ el.innerHTML='<div class="ph">카카오맵 로드 실패 — 카카오맵 사용설정 ON + JS SDK 도메인(localhost:5173) 확인</div>'; return; }
  if(map){ render(); return; }
  map=new kakao.maps.Map(el,{center:new kakao.maps.LatLng(36.3504,127.3845),level:7});
  clusterer=new kakao.maps.MarkerClusterer({map,averageCenter:true,minLevel:6});
  const ps=new kakao.maps.services.Places();
  const acc=[];
  function search(page){
    ps.keywordSearch('대전 빵집',(data,status,pg)=>{
      if(status===kakao.maps.services.Status.OK){
        acc.push(...data);
        if(pg.hasNextPage && page<3){ search(page+1); }
        else { places=dedupe(acc); render(); }
      } else { document.getElementById('lhead').textContent='검색 결과 없음 ('+status+')'; }
    },{size:15,page});
  }
  search(1);
}
function dedupe(arr){ const seen=new Set(),out=[]; for(const p of arr){ if(seen.has(p.id))continue; seen.add(p.id); out.push(p);} return out; }

function score(p){ let s=0; const t=tourOf(p.place_name);
  if(ans.explore==='famous' && t) s+=5;                          // 명물 선호 → 관광공사 등재 가산
  if(ans.explore==='local' && !t) s+=2;                          // 동네 선호 → 비등재 약가산
  if(ans.taste==='sweet' && /(케이크|디저트|타르트|마카롱|파이|케익)/.test(p.place_name)) s+=2;
  if(ans.taste==='salty' && /(소금|바게트|식빵|치아바타|베이글|하드)/.test(p.place_name)) s+=2;
  if(t) s+=1; return s;
}
function render(){
  let arr=places.slice();
  if(onlyFamous) arr=arr.filter(p=>tourOf(p.place_name));
  if(onlyOpen) arr=arr.filter(p=>{const t=tourOf(p.place_name);return nowOpen(t)===true;});
  arr.sort((a,b)=>score(b)-score(a));
  // markers
  markers.forEach(m=>m.setMap(null)); clusterer.clear(); markers=[];
  const bounds=new kakao.maps.LatLngBounds();
  arr.forEach((p,i)=>{ const pos=new kakao.maps.LatLng(p.y,p.x);
    const mk=new kakao.maps.Marker({position:pos,title:p.place_name});
    kakao.maps.event.addListener(mk,'click',()=>selectPlace(p));
    markers.push(mk); bounds.extend(pos);
  });
  clusterer.addMarkers(markers);
  if(arr.length) map.setBounds(bounds);
  // list
  const tasteLbl={sweet:'달달',salty:'짭짤'}[ans.taste]||'전체';
  const expLbl={famous:'명물',local:'동네'}[ans.explore]||'';
  document.getElementById('lhead').innerHTML='추천 <b>'+arr.length+'곳</b> · 취향: '+tasteLbl+(expLbl?'·'+expLbl:'');
  const lc=document.getElementById('list');
  lc.querySelectorAll('.lc').forEach(n=>n.remove());
  arr.forEach((p,i)=>{ const t=tourOf(p.place_name);
    const d=document.createElement('div'); d.className='lc'; d.dataset.id=p.id;
    d.innerHTML='<b><span class="rk">'+(i+1)+'</span>'+p.place_name+'</b>'+(t?'<span class="badge">'+(t.badge||'명물')+'</span>':'')+
      '<div class="ad">'+(p.road_address_name||p.address_name||'')+'</div>';
    d.onclick=()=>selectPlace(p);
    lc.appendChild(d);
  });
}
function selectPlace(p){ selected=p.id;
  document.querySelectorAll('.lc').forEach(n=>n.classList.toggle('sel',n.dataset.id===p.id));
  map.panTo(new kakao.maps.LatLng(p.y,p.x));
  const t=tourOf(p.place_name); const open=nowOpen(t);
  const d=document.getElementById('detail');
  d.innerHTML='<h2>'+p.place_name+(t?'<span class="badge">'+(t.badge||'명물')+'</span>':'')+(open===true?'<span class="open">영업 중</span>':'')+'</h2>'+
    '<div style="font-size:12px;color:var(--muted)">'+(p.category_name||'')+'</div>'+
    '<div class="dimg"></div>'+
    '<div class="dt"><span class="ic">📍</span>'+(p.road_address_name||p.address_name||'')+'</div>'+
    (p.phone?'<div class="dt"><span class="ic">📞</span>'+p.phone+'</div>':'')+
    (t&&t.hours?'<div class="dt"><span class="ic">🕒</span>'+t.hours+'</div>':'')+
    (t&&t.parking?'<div class="dt"><span class="ic">🅿️</span>'+t.parking+'</div>':'')+
    (t&&t.menu?'<div class="dt"><span class="ic">🥪</span>대표메뉴 · '+t.menu+'</div>':'')+
    '<div style="margin-top:10px"><a class="kakao" href="'+p.place_url+'" target="_blank">카카오맵에서 보기 →</a></div>'+
    (t? '<div class="src">🕒🅿️🥪 = 관광공사 데이터 · 그 외 = 카카오</div>'
      : '<div class="src">카카오 장소 데이터 · (관광공사 미등재 → 동네 빵집)</div>');
}
function toggleOpen(){ onlyOpen=!onlyOpen; document.getElementById('cOpen').classList.toggle('on',onlyOpen); if(map)render(); }
function toggleFamous(){ onlyFamous=!onlyFamous; document.getElementById('cFamous').classList.toggle('on',onlyFamous); if(map)render(); }

// SDK 로드 (services + clusterer)
(function(){ const s=document.createElement('script');
  s.src='https://dapi.kakao.com/v2/maps/sdk.js?appkey=ad932823acee73e5f087da1628784ca1&autoload=false&libraries=services,clusterer';
  s.onload=()=>kakao.maps.load(()=>{});
  document.head.appendChild(s);
})();
</script>
</body>
</html>
